name: Bug report
description: 提交一个可复现的问题
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先看 README 的「常见问题」，那里覆盖了手机打不开、只有 480P、没有 mp4 等情况。
        请**不要**贴出完整的 Cookie / SESSDATA。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 页面页脚显示的「前端 / 服务端」版本，或 Console 横幅第一行
      placeholder: 前端 v1.6 · 服务端 v1.6
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 运行方式
      options:
        - Windows web.bat
        - python server.py（Windows）
        - python server.py（macOS / Linux）
        - Docker
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 http://127.0.0.1:8737/
        2. 粘贴 ep...
        3. 点击开始下载
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / 实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 控制台日志（请打码 Cookie）
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue
          required: true
        - label: 我没有在内容里粘贴真实 Cookie / SESSDATA
          required: true
